    <script>
if (!window.global) window.global = window;
function updateLiveColors() {
    const fgColorHex = document.getElementById('qrFg').value || "#000000";
    const bgColorHex = document.getElementById('qrBg').value || "#ffffff";

    const r = parseInt(fgColorHex.slice(1, 3), 16) / 255;
    const g = parseInt(fgColorHex.slice(3, 5), 16) / 255;
    const b = parseInt(fgColorHex.slice(5, 7), 16) / 255;
    const fgNorm = { r: r.toFixed(3), g: g.toFixed(3), b: b.toFixed(3) };
    const br = parseInt(bgColorHex.slice(1, 3), 16) / 255;
    const bgG = parseInt(bgColorHex.slice(3, 5), 16) / 255;
    const bb = parseInt(bgColorHex.slice(5, 7), 16) / 255;
    const bgNorm = { r: br.toFixed(3), g: bgG.toFixed(3), b: bb.toFixed(3) };
    const svgCont = document.getElementById('svgContainer');
    if (!svgCont.src || svgCont.src === "") return;
    let currentSvgText = "";
    if (svgCont.src.startsWith("data:image/svg+xml;base64,")) {
        currentSvgText = decodeURIComponent(escape(atob(svgCont.src.split(",")[1])));
    } else {
        return; 
    }

    currentSvgText = currentSvgText.replace(/<feFuncR[^>]*tableValues="[^"]*"/i, `<feFuncR type="discrete" tableValues="${fgNorm.r} ${bgNorm.r}"`);
    currentSvgText = currentSvgText.replace(/<feFuncG[^>]*tableValues="[^"]*"/i, `<feFuncG type="discrete" tableValues="${fgNorm.g} ${bgNorm.g}"`);
    currentSvgText = currentSvgText.replace(/<feFuncB[^>]*tableValues="[^"]*"/i, `<feFuncB type="discrete" tableValues="${fgNorm.b} ${bgNorm.b}"`);
    currentSvgText = currentSvgText.replace(/<rect x="0" y="0"[^>]*fill="[^"]*"/i, `<rect x="0" y="0" width="${svgCont.getAttribute("width")}" height="${svgCont.getAttribute("width")}" stroke="none" fill="${bgColorHex}"`);

    const svgBase64 = btoa(unescape(encodeURIComponent(currentSvgText)));
    svgCont.src = `data:image/svg+xml;base64,${svgBase64}`;
    const downloadLink = document.getElementById('downloadLink');
    const oldOnClick = downloadLink.onclick;
    if (oldOnClick) {
        const targetSize = document.getElementById('qrSize').value || 500;
        const eccLevel = document.getElementById('qrEcc').value;
        let textData = document.getElementById('qrText').value.replace(/^https?:\/\//i, '');
        
        downloadLink.onclick = function() {
            const anchor = document.createElement('a');
            const blob = new Blob([ currentSvgText ], { type: 'image/svg+xml;charset=utf-8' });
            anchor.download = `${textData}_${targetSize}px_${eccLevel}.svg`;
            anchor.href = URL.createObjectURL(blob);
            anchor.click();
        };
    }
    createBookmark();
}
function escapeHTML(str) {
    return str.replace(/[&<>"']/g, function(match) {
        const escapeMap = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#x27;'
        };
        return escapeMap[match];
    });
}
function createBookmark() {
    const currentParams = new URLSearchParams();
    const standardKeys = ['qrFg', 'qrBg', 'qrSize', 'qrEcc'];
    standardKeys.forEach(key => {
      const element = document.getElementById(key);
      if (element && element.value) {
        currentParams.set(key, element.value);
      }
    });
    const textElement = document.getElementById('qrText');
    const textValue = textElement ? textElement.value : '';
    let queryString = currentParams.toString();
    if (textValue) {
      queryString += `${queryString ? '&' : ''}qrText=${encodeURIComponent(textValue)}`;
    }
    const bookmarkUrl = `${window.location.origin}${window.location.pathname}?${queryString}`;
    let shareLink = document.getElementById('qrShareLink');
    if (!shareLink) {
      shareLink = document.createElement('a');
      shareLink.id = 'qrShareLink';
      shareLink.target = '_blank';
      shareLink.style.cssText = 'display: block; margin-top: 1rem; color: #3b82f6; text-decoration: underline; word-break: break-all;';
      document.getElementById('outputArea').appendChild(shareLink);
    }
    shareLink.href = bookmarkUrl;
    shareLink.textContent = 'Bookmark or share this QR configuration';
}
window.addEventListener('DOMContentLoaded', async () => {
  if (navigator.clipboard) {
    try {
        const httpPattern = /^https?:\/\//i;
        const clipboardText = await navigator.clipboard.readText();
        const trimmedText = clipboardText.trim();
        if (httpPattern.test(trimmedText)) {
            const clipboardUrl = new URL(trimmedText);
            if (clipboardUrl.hostname !== location.hostname) {
                document.getElementById('qrText').value = trimmedText;
                buildTruePixelQR();
                return;
            }
        }
    } catch {}
  }
  if (!location.search) return;
  const params = new URLSearchParams(location.search);
  const config = {
    qrText: (val) => decodeURIComponent(val),
    qrFg: (val) => decodeURIComponent(val),
    qrBg: (val) => decodeURIComponent(val),
    qrSize: (val) => isNaN(Number(val)) ? null : val,
    qrEcc: (val) => ['L', 'M', 'Q', 'H'].includes(val) ? val : null
  };
  Object.keys(config).forEach(key => {
    if (params.has(key)) {
      const rawValue = params.get(key);
      const validatedValue = config[key](rawValue);
      if (validatedValue !== null) {
        const element = document.getElementById(key);
        if (element) {
          element.value = validatedValue;
        }
      }
    }
  });
  buildTruePixelQR();
});

<body>

<div>
    <h3 style="margin-top:0; margin-bottom: 0.2rem;">QR Generator</h3>
    <p style="font-size:0.8rem; color:#8c8c8c; margin:0;">Outputs an SVG.</p>
  <form action="javascript:void(buildTruePixelQR())">
    <label for="qrText">URL etc.</label>
    <input type="text" id="qrText" value="https://qrsvg.surge.sh">

    <label for="qrEcc">Error Correction (ECC) Level</label>
    <select id="qrEcc">
        <option value="L">L (Low - ~7% safety threshold)</option>
        <option value="M" selected>M (Medium - ~15% safety threshold)</option>
        <option value="Q">Q (Quartile - ~25% safety threshold)</option>
        <option value="H">H (High - ~30% safety threshold)</option>
    </select>

    <label for="qrSize">Print Dimensions (sans outer quiet zone)</label>
    <input type="number" id="qrSize" value="500" min="10" max="4000">

    <div style="display: flex; gap: 15px; margin: 0.5rem 0 1rem 0; align-items: flex-end; width: 100%; box-sizing: border-box;">

            <label for="qrFg" style="margin-bottom: 0.2rem; display: block;">Foreground (QR)</label>

        </div>

            <button type="button" style="font-size:x-large;height: 35px; width: 100%; min-width: 35px; padding: 0; cursor: pointer; box-sizing: border-box"
            onclick="[document.getElementById('qrFg').value, document.getElementById('qrBg').value] = [document.getElementById('qrBg').value, document.getElementById('qrFg').value]; if(document.getElementById('outputArea').style.display === 'block')updateLiveColors();">⇄</button>
        </div>
        <div style="width: 45%; display: flex; flex-direction: column;">
            <label for="qrBg" style="margin-bottom: 0.2rem; display: block;">Background</label>
            <input type="color" id="qrBg" value="#ffffff" style="width: 100%; height: 35px; display: block; padding: 0; border: none; cursor: pointer;" oninput="updateLiveColors()">
        </div>
    </div>
    <input type="reset" value="Defaults" tabindex="-1" style="pointer-events:none;visibility:hidden">
    <input type="submit" value="Generate SVG">
  </form>
    <div id="outputArea" style="display:none; margin-top: 1.5rem; text-align: center; padding-top: 1.2rem;">
        <img id="svgContainer" style="display: inline-block;" width="500">
        <button id="downloadLink" style="background:#10b981;">Save SVG File</button>
    </div>

<script>
function pikkolaToTinyPNG(textData, eccLevel) {
    const { size, modules } = PikkolaQR.encode(textData, eccLevel);
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const imgData = ctx.createImageData(size, size);
    const data = imgData.data;
    let idx = 0;
    for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
            const isDark = modules[r][c] === 1;
            const color = isDark ? 0 : 255;
            data[idx]     = color;
            data[idx + 1] = color;
            data[idx + 2] = color;
            data[idx + 3] = isDark ? 254 : 255;
            idx += 4;
        }
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas.toDataURL('image/png');
}
function buildTruePixelQR() {
    let textData = document.getElementById('qrText').value;
    const eccLevel = document.getElementById('qrEcc').value;
    const targetSize = parseInt(document.getElementById('qrSize').value, 10) || 500;
    let padding = targetSize / 12.5;
    const totalSize = Math.ceil(targetSize + (padding * 2));
    if (!textData) return alert("Please specify input URL text data first.");
    if (typeof PikkolaQR === 'undefined') return alert("The core engine is still initializing. Please wait a moment and try again.");
    try {
        const pngDataUri = pikkolaToTinyPNG(textData, eccLevel);
        const fgColorHex = document.getElementById('qrFg').value || "#000000";
        const bgColorHex = document.getElementById('qrBg').value || "#ffffff";
        const hexToNormalized = (hex) => {
            const r = parseInt(hex.slice(1, 3), 16) / 255;
            const g = parseInt(hex.slice(3, 5), 16) / 255;
            const b = parseInt(hex.slice(5, 7), 16) / 255;
            return { r: r.toFixed(3), g: g.toFixed(3), b: b.toFixed(3) };
        };
        const fg = hexToNormalized(fgColorHex);
        const bg = hexToNormalized(bgColorHex);

        const svgTemplate = `<?xml version="1.0" encoding="UTF-8" ?>
<svg width="${totalSize}" height="${totalSize}" viewBox="0 0 ${totalSize} ${totalSize}"
    role="img" aria-labelledby="QR-title" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<title id="QR-title">${escapeHTML(textData)}</title>
<style>
/* <![CDATA[ */
@media screen {
 svg{width:100dvw;height:100dvh}
}
/* ]]> */
</style>
<defs>
  <filter id="deblur" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="${fg.r} ${bg.r}"/>
      <feFuncG type="discrete" tableValues="${fg.g} ${bg.g}"/>
      <feFuncB type="discrete" tableValues="${fg.b} ${bg.b}"/>
      <feFuncA type="discrete" tableValues="1"/>
    </feComponentTransfer>
  </filter>
  <clipPath id="cleanEdge">
    <rect x="${padding + 0.5}" y="${padding + 0.5}" width="${targetSize - 1}" height="${targetSize - 1}" />
  </clipPath>
</defs>
<rect x="0" y="0" width="${totalSize}" height="${totalSize}" stroke="none" fill="${bgColorHex}" />
<image x="${padding}" y="${padding}" width="${targetSize}" height="${targetSize}" 
       clip-path="url(#cleanEdge)" filter="url(#deblur)" xlink:href="${pngDataUri}"/>
</svg>`;

        const svgBase64 = btoa(unescape(encodeURIComponent(svgTemplate)));
        const svgDataUri = `data:image/svg+xml;base64,${svgBase64}`;
        const svgCont = document.getElementById('svgContainer');
        svgCont.src = svgDataUri;
        svgCont.setAttribute("width", totalSize);

        const downloadLink = document.getElementById('downloadLink');
        downloadLink.onclick = function() {
            const anchor = document.createElement('a');
            const blob = new Blob([ svgTemplate ], { type: 'image/svg+xml;charset=utf-8' });
            const cleanName = textData.replace(/^https?:\/\//i, '');
            anchor.download = `${cleanName}_${targetSize}px_${eccLevel}.svg`;
            anchor.href = URL.createObjectURL(blob);
            anchor.click();
        };

        document.getElementById('outputArea').style.display = 'block';
        createBookmark();
        document.querySelector('input[type="reset"]').setAttribute("style","pointer-events:auto;visibility:visible");
        
    } catch (error) {
        if (error && error.code === "TOO_LONG") {
            alert(`Input text (${error.bytes} bytes) exceeds the maximum QR capacity for ECC level ${eccLevel}.`);
        } else {
            alert("The script encountered an evaluation exception during dynamic template construction.");
        }
        console.error(error);
    }
}
